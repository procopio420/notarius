---
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: python3
          docker_compose_env: development

    staging:
      hosts:
        staging-server:
          ansible_host: staging.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-staging.pem
          docker_compose_env: staging
          environment: staging

    production:
      hosts:
        prod-web-1:
          ansible_host: web1.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: web
        prod-web-2:
          ansible_host: web2.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: web
        prod-api-1:
          ansible_host: api1.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: api
        prod-api-2:
          ansible_host: api2.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: api
        prod-db-1:
          ansible_host: db1.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: database
        prod-monitoring:
          ansible_host: monitoring.notarius.com
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/notarius-prod.pem
          docker_compose_env: production
          environment: production
          role: monitoring

  vars:
    # Common variables
    project_name: notarius
    project_dir: /opt/notarius
    docker_compose_file: docker-compose.yml
    backup_dir: /opt/backups
    log_dir: /var/log/notarius
    
    # Database settings
    postgres_version: "16"
    redis_version: "7-alpine"
    
    # Security settings
    firewall_enabled: true
    fail2ban_enabled: true
    ssl_enabled: true
    
    # Monitoring settings
    prometheus_retention: "30d"
    grafana_admin_password: "{{ vault_grafana_admin_password }}"
    
    # Backup settings
    backup_retention_days: 30
    backup_schedule: "0 2 * * *"  # Daily at 2 AM

