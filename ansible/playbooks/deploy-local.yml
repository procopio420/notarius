---
# Deploy Notarius to local environment
- name: Deploy Notarius locally
  hosts: local
  become: yes
  gather_facts: yes
  
  vars:
    environment: local
    docker_compose_env: development
    
  tasks:
    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy project files
      synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ project_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=venv"
          - "--exclude=.env"

    - name: Create local environment file
      copy:
        src: "{{ playbook_dir }}/../../.env.example"
        dest: "{{ project_dir }}/.env"
        mode: '0600'
      when: not ansible_check_mode

    - name: Set proper ownership
      file:
        path: "{{ project_dir }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes

    - name: Build and start services
      docker_compose:
        project_src: "{{ project_dir }}"
        state: present
        build: yes
        recreate: always
      become_user: "{{ ansible_user }}"

    - name: Wait for services to be ready
      wait_for:
        port: "{{ item }}"
        host: localhost
        timeout: 60
      loop:
        - "8000"  # Notarius API
        - "8001"  # LexNode API
        - "8002"  # PII Vault
        - "8003"  # Intent Engine
        - "3000"  # Web UI

    - name: Run database migrations
      docker_compose:
        project_src: "{{ project_dir }}"
        command: "python manage.py migrate"
        services:
          - notarius-api
      become_user: "{{ ansible_user }}"

    - name: Create superuser
      docker_compose:
        project_src: "{{ project_dir }}"
        command: "python manage.py createsuperuser --noinput --username admin --email admin@notarius.com"
        services:
          - notarius-api
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Display local deployment info
      debug:
        msg: |
          Local Notarius deployment completed!
          
          Access URLs:
          - Web UI: http://localhost:3000
          - API: http://localhost:8000
          - LexNode: http://localhost:8001
          - PII Vault: http://localhost:8002
          - Intent Engine: http://localhost:8003
          - Grafana: http://localhost:3001
          - Prometheus: http://localhost:9090
          - Jaeger: http://localhost:16686
          - MailHog: http://localhost:8025
          - MinIO: http://localhost:9001
          
          Admin credentials:
          - Username: admin
          - Email: admin@notarius.com

