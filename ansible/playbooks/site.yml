---
# Main playbook for Notarius deployment
- name: Deploy Notarius to all environments
  hosts: all
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  roles:
    - common
    - docker
    - security
    - notarius

  post_tasks:
    - name: Display deployment summary
      debug:
        msg: |
          Notarius deployment completed successfully!
          Environment: {{ environment | default('local') }}
          Services: {{ docker_compose_env | default('development') }}
          Access URLs:
            - Web UI: http://{{ ansible_default_ipv4.address }}:3000
            - API: http://{{ ansible_default_ipv4.address }}:8000
            - Grafana: http://{{ ansible_default_ipv4.address }}:3001
            - Prometheus: http://{{ ansible_default_ipv4.address }}:9090

