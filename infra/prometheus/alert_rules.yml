groups:
  - name: notarius_alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: sum(rate(errors_total[5m])) by (service) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Service {{ $labels.service }} has error rate of {{ $value }} errors/sec"

      # PII leak detected
      - alert: PIILeakDetected
        expr: increase(pii_leak_alerts_total[1m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "PII leak detected"
          description: "PII leak alert triggered for service {{ $labels.service }}"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "Service {{ $labels.service }} has 95th percentile response time of {{ $value }}s"

      # Low AI confidence
      - alert: LowAIConfidence
        expr: histogram_quantile(0.50, sum(rate(intent_confidence_score_bucket[5m])) by (le, service)) < 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low AI confidence"
          description: "Service {{ $labels.service }} has low intent confidence score of {{ $value }}"

      # PII Vault high latency
      - alert: PIIVaultHighLatency
        expr: histogram_quantile(0.95, sum(rate(pii_tokenize_duration_seconds_bucket[5m])) by (le, service)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PII Vault high latency"
          description: "PII Vault service has high tokenization latency of {{ $value }}s"

      # LexNode high latency
      - alert: LexNodeHighLatency
        expr: histogram_quantile(0.95, sum(rate(lexnode_retrieve_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LexNode high latency"
          description: "LexNode service has high retrieval latency of {{ $value }}s"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Service {{ $labels.instance }} is down"

      # High memory usage
      - alert: HighMemoryUsage
        expr: memory_usage_bytes / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Service {{ $labels.service }} is using {{ $value }}GB of memory"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: sum(rate(lexnode_cache_hits_total[5m])) / (sum(rate(lexnode_cache_hits_total[5m])) + sum(rate(lexnode_cache_misses_total[5m]))) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Service {{ $labels.service }} has low cache hit rate of {{ $value }}"

      # High AI draft edit rate
      - alert: HighAIEditRate
        expr: histogram_quantile(0.95, sum(rate(ai_draft_edit_rate_bucket[5m])) by (le, service)) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High AI draft edit rate"
          description: "Service {{ $labels.service }} has high AI draft edit rate of {{ $value }}"
