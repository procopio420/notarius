    - name: Run integration tests
      run: |
        cd apps/notarius-api
        pytest tests/integration/ -v --cov=apps --cov-report=xml --cov-report=html --junitxml=integration-test-results.xml
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_notarius
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: True
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: apps/notarius-api/coverage.xml
        flags: integration
        name: integration-tests

  security-tests:
