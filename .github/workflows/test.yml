    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/notarius-api/requirements-test.txt
    
    - name: Run load tests
      run: |
        cd apps/notarius-api
        locust --headless --users 100 --spawn-rate 10 --run-time 60s --host http://localhost:8000 --html load-test-report.html
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_notarius
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: True
    
    - name: Upload load test results
      uses: actions/upload-artifact@v3
      with:
        name: load-test-results
        path: apps/notarius-api/load-test-report.html

  pii-detection:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
