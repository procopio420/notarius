        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/notarius-api/requirements-test.txt
    
    - name: Run PII detection
      run: |
        cd apps/notarius-api
        python -m pytest tests/security/test_security_pii.py -v --junitxml=pii-test-results.xml
    
    - name: Upload PII test results
      uses: actions/upload-artifact@v3
      with:
        name: pii-test-results
        path: apps/notarius-api/pii-test-results.xml

  test-results:
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, integration-tests, security-tests, performance-tests, e2e-tests, load-tests, pii-detection]
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: all-test-results
        path: |
          apps/notarius-api/*-test-results.xml
          apps/notarius-api/coverage.xml
          apps/notarius-api/htmlcov/
          apps/notarius-api/load-test-report.html
          apps/notarius-api/pii-test-results.xml
          bandit-report.json
          safety-report.json
          semgrep-report.json
