name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  DJANGO_VERSION: "5.2"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
        pip install -r apps/notarius-api/requirements-test.txt
    
    - name: Run black
      run: |
        black --check --diff apps/notarius-api/
    
    - name: Run isort
      run: |
        isort --check-only --diff apps/notarius-api/
    
    - name: Run flake8
      run: |
        flake8 apps/notarius-api/
    
    - name: Run mypy
      run: |
        mypy apps/notarius-api/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        pip install -r apps/notarius-api/requirements-test.txt
    
    - name: Run bandit
      run: |
        bandit -r apps/notarius-api/ -f json -o bandit-report.json
    
    - name: Run safety
      run: |
        safety check --json --output safety-report.json
    
    - name: Run semgrep
      run: |
        semgrep --config=auto --json --output=semgrep-report.json apps/notarius-api/

  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notarius
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/notarius-api/requirements-test.txt
    
    - name: Run unit tests
      run: |
        cd apps/notarius-api
        pytest tests/unit/ -v --cov=apps --cov-report=xml --cov-report=html --junitxml=unit-test-results.xml
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_notarius
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: True
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: apps/notarius-api/coverage.xml
        flags: unit
        name: unit-tests

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notarius
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
