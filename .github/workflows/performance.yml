name: Performance Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 4 * * 0'  # Weekly on Sunday at 4 AM
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Load Testing
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install locust pytest-benchmark

      - name: Run load tests
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          poetry run locust -f tests/performance/load_test.py \
            --host=$TARGET_URL \
            --users=100 \
            --spawn-rate=10 \
            --run-time=5m \
            --headless \
            --html=load-test-report.html

      - name: Upload load test report
        uses: actions/upload-artifact@v3
        with:
          name: load-test-report
          path: load-test-report.html

  # Stress Testing
  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install locust pytest-benchmark

      - name: Run stress tests
        env:
          TARGET_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          poetry run locust -f tests/performance/stress_test.py \
            --host=$TARGET_URL \
            --users=500 \
            --spawn-rate=50 \
            --run-time=10m \
            --headless \
            --html=stress-test-report.html

      - name: Upload stress test report
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-report
          path: stress-test-report.html

  # API Performance Testing
  api-performance-test:
    name: API Performance Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install pytest-benchmark requests

      - name: Run API performance tests
        env:
          API_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          poetry run pytest tests/performance/api_performance_test.py \
            --benchmark-only \
            --benchmark-save=api-performance \
            --benchmark-save-data \
            -v

      - name: Upload API performance report
        uses: actions/upload-artifact@v3
        with:
          name: api-performance-report
          path: .benchmarks/

  # Database Performance Testing
  database-performance-test:
    name: Database Performance Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notarius
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install pytest-benchmark

      - name: Run database performance tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_notarius
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: notarius.settings.testing
        run: |
          poetry run pytest tests/performance/database_performance_test.py \
            --benchmark-only \
            --benchmark-save=database-performance \
            --benchmark-save-data \
            -v

      - name: Upload database performance report
        uses: actions/upload-artifact@v3
        with:
          name: database-performance-report
          path: .benchmarks/

  # Memory Usage Testing
  memory-usage-test:
    name: Memory Usage Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install memory-profiler psutil

      - name: Run memory usage tests
        run: |
          poetry run python -m memory_profiler tests/performance/memory_usage_test.py

      - name: Upload memory usage report
        uses: actions/upload-artifact@v3
        with:
          name: memory-usage-report
          path: memory_usage_report.txt

  # CPU Usage Testing
  cpu-usage-test:
    name: CPU Usage Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install psutil

      - name: Run CPU usage tests
        run: |
          poetry run python tests/performance/cpu_usage_test.py

      - name: Upload CPU usage report
        uses: actions/upload-artifact@v3
        with:
          name: cpu-usage-report
          path: cpu_usage_report.txt

  # Response Time Testing
  response-time-test:
    name: Response Time Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install requests time

      - name: Run response time tests
        env:
          API_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          poetry run python tests/performance/response_time_test.py

      - name: Upload response time report
        uses: actions/upload-artifact@v3
        with:
          name: response-time-report
          path: response_time_report.txt

  # Performance Summary
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [load-test, stress-test, api-performance-test, database-performance-test, memory-usage-test, cpu-usage-test, response-time-test]
    if: always()
    steps:
      - name: Download all performance reports
        uses: actions/download-artifact@v3

      - name: Generate performance summary
        run: |
          echo "## Performance Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Load Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.load-test.result }}" = "success" ]; then
            echo "✅ Load testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Load testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Stress Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.stress-test.result }}" = "success" ]; then
            echo "✅ Stress testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Stress testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Performance Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.api-performance-test.result }}" = "success" ]; then
            echo "✅ API performance testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ API performance testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Database Performance Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.database-performance-test.result }}" = "success" ]; then
            echo "✅ Database performance testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Database performance testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Memory Usage Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.memory-usage-test.result }}" = "success" ]; then
            echo "✅ Memory usage testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Memory usage testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CPU Usage Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.cpu-usage-test.result }}" = "success" ]; then
            echo "✅ CPU usage testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ CPU usage testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Response Time Testing" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.response-time-test.result }}" = "success" ]; then
            echo "✅ Response time testing completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Response time testing failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "All performance test reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
