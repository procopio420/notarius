name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Dependency Security Scan
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install safety bandit

      - name: Install Node.js dependencies
        run: |
          cd apps/notarius-web
          npm ci

      - name: Run Python security scan
        run: |
          poetry run safety check --json --output safety-report.json
          poetry run bandit -r apps/ packages/ -f json -o bandit-report.json

      - name: Run Node.js security scan
        run: |
          cd apps/notarius-web
          npm audit --json > npm-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            npm-audit-report.json

  # Container Security Scan
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [notarius-api, pii-vault, lexnode-api, intent-engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ matrix.service }}:latest \
            --load \
            apps/${{ matrix.service }}/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'

  # Code Quality Security Scan
  code-quality-scan:
    name: Code Quality Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install bandit semgrep

      - name: Install Node.js dependencies
        run: |
          cd apps/notarius-web
          npm ci

      - name: Run Bandit security linter
        run: |
          poetry run bandit -r apps/ packages/ -f json -o bandit-report.json

      - name: Run Semgrep security scanner
        run: |
          poetry run semgrep --config=auto --json --output=semgrep-report.json .

      - name: Run Node.js security scan
        run: |
          cd apps/notarius-web
          npm audit --json > npm-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            npm-audit-report.json

  # Infrastructure Security Scan
  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install checkov

      - name: Run Checkov infrastructure security scan
        run: |
          poetry run checkov -d infra/terraform/ --framework terraform --output json --output-file-path checkov-report.json

      - name: Upload infrastructure security report
        uses: actions/upload-artifact@v3
        with:
          name: infrastructure-security-report
          path: checkov-report.json

  # PII Protection Scan
  pii-protection-scan:
    name: PII Protection Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          poetry run detect-secrets scan --all-files --baseline .secrets.baseline

      - name: Run PII protection tests
        env:
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: notarius.settings.testing
        run: |
          poetry run pytest tests/pii/ -v

  # Compliance Scan
  compliance-scan:
    name: Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install checkov

      - name: Run compliance checks
        run: |
          # GDPR compliance check
          poetry run checkov -d . --framework terraform --check CKV_AWS_79 --output json --output-file-path gdpr-compliance-report.json
          
          # SOC 2 compliance check
          poetry run checkov -d . --framework terraform --check CKV_AWS_23 --output json --output-file-path soc2-compliance-report.json

      - name: Upload compliance reports
        uses: actions/upload-artifact@v3
        with:
          name: compliance-reports
          path: |
            gdpr-compliance-report.json
            soc2-compliance-report.json

  # Security Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, code-quality-scan, infrastructure-scan, pii-protection-scan, compliance-scan]
    if: always()
    steps:
      - name: Download all security reports
        uses: actions/download-artifact@v3

      - name: Generate security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f "security-reports/safety-report.json" ]; then
            echo "✅ Python dependencies scanned" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python dependencies scan failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "security-reports/npm-audit-report.json" ]; then
            echo "✅ Node.js dependencies scanned" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Node.js dependencies scan failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker images scanned for vulnerabilities" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code scanned for security issues" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Infrastructure scanned for security misconfigurations" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PII Protection Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ PII protection mechanisms tested" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compliance Scan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Compliance requirements checked" >> $GITHUB_STEP_SUMMARY
