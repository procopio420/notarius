name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '1.0.0'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1

jobs:
  # Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          release_name: Release ${{ steps.get-version.outputs.version }}
          body: |
            ## What's Changed
            
            * Automated release ${{ steps.get-version.outputs.version }}
            * Full test suite passed
            * Security scans completed
            * Docker images built and pushed
            
            ## Docker Images
            
            * `notarius-api:${{ steps.get-version.outputs.version }}`
            * `pii-vault:${{ steps.get-version.outputs.version }}`
            * `lexnode-api:${{ steps.get-version.outputs.version }}`
            * `intent-engine:${{ steps.get-version.outputs.version }}`
            
            ## Installation
            
            ```bash
            # Pull the latest images
            docker pull notarius-api:${{ steps.get-version.outputs.version }}
            docker pull pii-vault:${{ steps.get-version.outputs.version }}
            docker pull lexnode-api:${{ steps.get-version.outputs.version }}
            docker pull intent-engine:${{ steps.get-version.outputs.version }}
            ```
            
            ## Changelog
            
            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false

  # Build and Push Docker Images
  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [create-release]
    strategy:
      matrix:
        service: [notarius-api, pii-vault, lexnode-api, intent-engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.create-release.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            apps/$ECR_REPOSITORY/

  # Update Helm Charts
  update-helm-charts:
    name: Update Helm Charts
    runs-on: ubuntu-latest
    needs: [create-release, build-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install pyyaml

      - name: Update Helm chart versions
        run: |
          python scripts/update-helm-charts.py ${{ needs.create-release.outputs.version }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add infra/helm/
          git commit -m "Update Helm charts to version ${{ needs.create-release.outputs.version }}" || exit 0
          git push

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [create-release, build-images, update-helm-charts]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to staging
        run: |
          cd infra/terraform
          terraform init
          terraform plan -var-file=staging.tfvars -var="container_image_tag=${{ needs.create-release.outputs.version }}"
          terraform apply -var-file=staging.tfvars -var="container_image_tag=${{ needs.create-release.outputs.version }}" -auto-approve

  # Run Smoke Tests
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install pytest requests

      - name: Run smoke tests
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          poetry run pytest tests/smoke/ -v

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to production
        run: |
          cd infra/terraform
          terraform init
          terraform plan -var-file=production.tfvars -var="container_image_tag=${{ needs.create-release.outputs.version }}"
          terraform apply -var-file=production.tfvars -var="container_image_tag=${{ needs.create-release.outputs.version }}" -auto-approve

  # Run Production Tests
  production-tests:
    name: Run Production Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install pytest requests

      - name: Run production tests
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          poetry run pytest tests/production/ -v

  # Update Release Notes
  update-release-notes:
    name: Update Release Notes
    runs-on: ubuntu-latest
    needs: [production-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update release with deployment status
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ needs.create-release.outputs.version }}'
            });
            
            const updatedBody = release.body + `
            
            ## Deployment Status
            
            ✅ Staging deployment successful
            ✅ Smoke tests passed
            ✅ Production deployment successful
            ✅ Production tests passed
            
            ## Monitoring
            
            * [Staging Environment](https://staging.notarius.example.com)
            * [Production Environment](https://notarius.example.com)
            * [Grafana Dashboard](https://grafana.notarius.example.com)
            `;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: updatedBody
            });

  # Notify Success
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [update-release-notes]
    steps:
      - name: Notify release success
        run: |
          echo "Release ${{ needs.create-release.outputs.version }} deployed successfully!"
          # Add notification logic here (Slack, email, etc.)

  # Notify Failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify release failure
        run: |
          echo "Release ${{ needs.create-release.outputs.version }} failed!"
          # Add notification logic here (Slack, email, etc.)
