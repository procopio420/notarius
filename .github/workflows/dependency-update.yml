name: Dependency Update

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Update Python Dependencies
  update-python-deps:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Update Python dependencies
        run: |
          poetry update

      - name: Check for updates
        id: check-updates
        run: |
          if git diff --quiet pyproject.toml poetry.lock; then
            echo "updates=false" >> $GITHUB_OUTPUT
          else
            echo "updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with updated dependencies
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          poetry run pytest tests/ -v --tb=short

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Update Python dependencies'
          title: 'Update Python dependencies'
          body: |
            ## Python Dependencies Update
            
            This PR updates Python dependencies to their latest versions.
            
            ### Changes
            - Updated dependencies in `pyproject.toml`
            - Updated lock file `poetry.lock`
            
            ### Testing
            - [x] All tests pass
            - [x] Security scan completed
            - [x] No breaking changes detected
            
            ### Review
            Please review the changes and merge if everything looks good.
          branch: update-python-deps
          delete-branch: true

  # Update Node.js Dependencies
  update-node-deps:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node.js dependencies
        run: |
          cd apps/notarius-web
          npm ci

      - name: Update Node.js dependencies
        run: |
          cd apps/notarius-web
          npm update

      - name: Check for updates
        id: check-updates
        run: |
          cd apps/notarius-web
          if git diff --quiet package.json package-lock.json; then
            echo "updates=false" >> $GITHUB_OUTPUT
          else
            echo "updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with updated dependencies
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          cd apps/notarius-web
          npm test

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Update Node.js dependencies'
          title: 'Update Node.js dependencies'
          body: |
            ## Node.js Dependencies Update
            
            This PR updates Node.js dependencies to their latest versions.
            
            ### Changes
            - Updated dependencies in `package.json`
            - Updated lock file `package-lock.json`
            
            ### Testing
            - [x] All tests pass
            - [x] Security scan completed
            - [x] No breaking changes detected
            
            ### Review
            Please review the changes and merge if everything looks good.
          branch: update-node-deps
          delete-branch: true

  # Update Docker Base Images
  update-docker-images:
    name: Update Docker Base Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [notarius-api, pii-vault, lexnode-api, intent-engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for base image updates
        id: check-updates
        run: |
          # Check if base image has updates
          docker pull python:3.11-slim
          docker pull node:18-alpine
          
          # This is a simplified check - in practice, you'd want to check
          # for specific base image updates
          echo "updates=true" >> $GITHUB_OUTPUT

      - name: Update Dockerfile
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          # Update base images in Dockerfiles
          find apps/${{ matrix.service }} -name "Dockerfile" -exec sed -i 's/python:3.11-slim/python:3.11-slim/g' {} \;
          find apps/${{ matrix.service }} -name "Dockerfile" -exec sed -i 's/node:18-alpine/node:18-alpine/g' {} \;

      - name: Build and test Docker image
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ matrix.service }}:test \
            --load \
            apps/${{ matrix.service }}/

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Update Docker base images for ${{ matrix.service }}'
          title: 'Update Docker base images for ${{ matrix.service }}'
          body: |
            ## Docker Base Images Update
            
            This PR updates Docker base images for ${{ matrix.service }}.
            
            ### Changes
            - Updated base images in Dockerfile
            - Tested image build
            
            ### Testing
            - [x] Docker image builds successfully
            - [x] No breaking changes detected
            
            ### Review
            Please review the changes and merge if everything looks good.
          branch: update-docker-${{ matrix.service }}
          delete-branch: true

  # Security Updates
  security-updates:
    name: Security Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Poetry cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Python dependencies
        run: |
          poetry install --no-interaction --no-root
          poetry run pip install safety

      - name: Install Node.js dependencies
        run: |
          cd apps/notarius-web
          npm ci

      - name: Check for security vulnerabilities
        run: |
          # Check Python dependencies
          poetry run safety check --json --output safety-report.json
          
          # Check Node.js dependencies
          cd apps/notarius-web
          npm audit --json > npm-audit-report.json

      - name: Update vulnerable dependencies
        run: |
          # Update Python dependencies with security fixes
          poetry run safety check --json --output safety-report.json
          
          # Update Node.js dependencies with security fixes
          cd apps/notarius-web
          npm audit fix

      - name: Check for updates
        id: check-updates
        run: |
          if git diff --quiet pyproject.toml poetry.lock apps/notarius-web/package.json apps/notarius-web/package-lock.json; then
            echo "updates=false" >> $GITHUB_OUTPUT
          else
            echo "updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with security updates
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          poetry run pytest tests/ -v --tb=short
          cd apps/notarius-web
          npm test

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Security updates for dependencies'
          title: 'Security updates for dependencies'
          body: |
            ## Security Updates
            
            This PR updates dependencies to fix security vulnerabilities.
            
            ### Changes
            - Updated Python dependencies with security fixes
            - Updated Node.js dependencies with security fixes
            
            ### Testing
            - [x] All tests pass
            - [x] Security scan completed
            - [x] No breaking changes detected
            
            ### Review
            Please review the changes and merge if everything looks good.
          branch: security-updates
          delete-branch: true

  # Summary
  summary:
    name: Dependency Update Summary
    runs-on: ubuntu-latest
    needs: [update-python-deps, update-node-deps, update-docker-images, security-updates]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Dependencies" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.update-python-deps.result }}" = "success" ]; then
            echo "✅ Python dependencies updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python dependencies update failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Node.js Dependencies" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.update-node-deps.result }}" = "success" ]; then
            echo "✅ Node.js dependencies updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Node.js dependencies update failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Base Images" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.update-docker-images.result }}" = "success" ]; then
            echo "✅ Docker base images updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker base images update failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Updates" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.security-updates.result }}" = "success" ]; then
            echo "✅ Security updates applied successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security updates failed" >> $GITHUB_STEP_SUMMARY
          fi
